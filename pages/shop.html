<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - WOWMART</title>
    <script src="../theme-init.js"></script>
    <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="../wishlist.css">
    <link rel="stylesheet" href="../header.css">
    <link rel="stylesheet" href="../search.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../dark.css">
</head>
<body>
    <!-- Shared header is rendered by ../header.js -->
    <div id="site-header"></div>

    <!-- Breadcrumb -->
    <div class="container breadcrumb">
        <a href="../index.html">Home</a> / <span id="breadcrumb-category">Shop</span>
    </div>

    <!-- Main Shop Section -->
    <main class="container shop-main">
        <!-- Sidebar filters: built by shop.js from the products on this page (price range, brands, sizes, colours) -->
        <aside class="sidebar-filter" id="filterPanel" aria-label="Product filters">
            <div class="filter-header">
                <h3>Filters</h3>
                <button type="button" class="advanced-filter" id="clearFilters" hidden>Clear all</button>
            </div>
            <div id="filterBody"></div>
        </aside>

        <!-- Product Listing Area -->
        <section class="product-listing-area">
            <div class="listing-header">
                <h2 id="resultCount">Loading results...</h2>
                <div class="listing-tools">
                    <button type="button" class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filterPanel"><i class="fa-solid fa-sliders"></i> Filters <span class="filter-badge" id="filterBadge" hidden></span></button>
                    <div class="sort-box">
                        <label for="sortSelect">Sort by:</label>
                        <select id="sortSelect"></select>
                    </div>
                </div>
            </div>
            <div class="active-chips" id="activeChips" aria-live="polite"></div>

            <!-- Products Grid -->
            <div class="shop-grid" id="shopGrid">
                <!-- Products will be loaded dynamically via shop.js -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-bottom">
            <p>&copy; 2026 WOWMART. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="shop.js"></script>
</body>
</html>
