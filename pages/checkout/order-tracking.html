<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Track Order - WOWMART</title>
    <link rel="stylesheet" href="checkout.css">
    <link rel="stylesheet" href="../../header.css">
    <link rel="stylesheet" href="../../search.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="site-header"></div>
    
    <main class="container">
        <section class="card tracking-card" id="trackingRoot">
            <h1>Track your order</h1>
            <form id="trackingForm" class="tracking-form">
                <label for="trackingIdInput">Tracking ID</label>
                <div>
                    <input id="trackingIdInput" required placeholder="Enter your tracking ID">
                    <button class="btn btn-primary" type="submit">Track</button>
                </div>
            </form>
            <div id="trackingResult" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        &copy; 2026 WOWMART. All rights reserved.
    </footer>

    <script type="module" src="order-tracking.js"></script>
</body>
</html>
