<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - WOWMART</title>
    <!-- checkout.css gives the shared cards / buttons / bill table; cart.css adds the cart-only rows -->
    <link rel="stylesheet" href="checkout/checkout.css">
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="../header.css">
    <link rel="stylesheet" href="../search.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Shared header is rendered by ../header.js -->
    <div id="site-header"></div>

    <main class="container cart-page">
        <div class="cart-title">
            <h1><i class="fa-solid fa-cart-shopping"></i> Shopping Cart <span class="count-pill" id="cartCount"></span></h1>
            <button type="button" class="link-btn" id="clearCartBtn" hidden>Clear cart</button>
        </div>

        <!-- Filled by cart.js: either the empty message or the cart + bill summary -->
        <div id="cartRoot"><p class="cart-loading">Loading your cart&hellip;</p></div>
    </main>

    <footer>&copy; 2026 WOWMART. All rights reserved.</footer>

    <script type="module" src="cart.js"></script>
</body>
</html>
