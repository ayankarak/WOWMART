<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - WOWMART</title>
  <link rel="stylesheet" href="account.css">
  <!-- "defer" = runs after the HTML is parsed, so every element below exists when script.js looks for it -->
  <script src="auth.js"></script>
</head>

<body>
  <main class="login-wrap">
    <div class="login-html">
      <input id="tab-1" type="radio" name="tab" class="sign-in" checked>
      <label for="tab-1" class="tab">Sign In</label>
      <input id="tab-2" type="radio" name="tab" class="sign-up">
      <label for="tab-2" class="tab">Sign Up</label>
      <div class="session-banner" id="sessionBanner" hidden>
        Signed in as <strong id="sessionName"></strong>.
        <button type="button" id="signOutBtn">Sign out</button>
        <span aria-hidden="true">·</span>
        <a href="index.html">Go to store</a>
      </div>

      <div class="login-form">
        <form class="sign-in-htm" id="signin-form" novalidate>
          <div class="group">
            <label for="signin-user" class="label">Username or Email</label>
            <input id="signin-user" type="text" class="input" autocomplete="username">
          </div>
          <div class="group">
            <label for="signin-pass" class="label">Password</label>
            <input id="signin-pass" type="password" class="input" autocomplete="current-password">
          </div>
          <div class="group">
            <input id="check" type="checkbox" class="check" checked>
            <label for="check"><span class="icon"></span> Keep me signed in</label>
          </div>
          <p class="form-msg" id="signin-msg" role="alert"></p>
          <div class="group">
            <input type="submit" class="button" id="signin-btn" value="Sign In">
          </div>
          <div class="hr"></div>
          <div class="foot-lnk"><a href="#forgot">Forgot Password?</a></div>
        </form>
        <form class="sign-up-htm" id="signup-form" novalidate>
          <div class="group">
            <label for="signup-user" class="label">Username</label>
            <input id="signup-user" type="text" class="input" autocomplete="username">
          </div>
          <div class="group">
            <label for="signup-pass" class="label">Password</label>
            <input id="signup-pass" type="password" class="input" autocomplete="new-password">
          </div>
          <div class="group">
            <label for="signup-pass-repeat" class="label">Repeat Password</label>
            <input id="signup-pass-repeat" type="password" class="input" autocomplete="new-password">
          </div>
          <div class="group">
            <label for="signup-email" class="label">Email Address</label>
            <input id="signup-email" type="email" class="input" autocomplete="email">
          </div>
          <p class="form-msg" id="signup-msg" role="alert"></p>
          <div class="group">
            <input type="submit" class="button" id="signup-btn" value="Sign Up">
          </div>
          <div class="hr"></div>
          <div class="foot-lnk"><label for="tab-1">Already a member?</label></div>
        </form>

      </div>
    </div>
  </main>
</body>

</html>
